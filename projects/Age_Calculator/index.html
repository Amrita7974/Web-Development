<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" type="" href="style.css" />
  </head>
  <body>
    <div class="w-25 bg-light rounded shadow border mx-auto mt-5 p-4">
      <h1 class="text-center mb-3">Age Calculator</h1>

      <form class="d-flex flex-column gap-3 align-items-center w-100 p-3">
        <label for="DOB">Enter your Date of Birth</label>
        <input type="date" name="DOB" id="DOB" class="form-control" />
        <label for="CurrentDate">Choose Current Date</label>
        <input
          type="date"
          name="CurrentDate"
          id="CurrentDate"
          class="form-control"
        />
        <button type="submit" class="btn btn-primary">Calulate Age</button>
      </form>

      <div class="fw-bold text-center">
        Your Age is :  <span id="MyAge">XX</span> Years   
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
