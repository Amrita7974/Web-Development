 <!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    /> 
  </head>
  <body class="bg-primary bg-gradient min-vh-100 d-flex flex-column text-white">
    
    <header class="navbar navbar-dark bg-white bg-opacity-10 shadow py-3 mb-5 border-bottom border-white border-opacity-10">
      <div class="container d-flex justify-content-center align-items-center gap-3">
        <span class="navbar-brand mb-0 h1 fs-3 fw-bold text-uppercase tracking-wider">
          Mausam ka Haal
        </span>
        <div class="d-flex gap-2 fs-4 bg-black bg-opacity-25 px-3 py-1 rounded-pill shadow-sm">
          <span title="Sunny">🌞</span>
          <span title="Winter">❄️</span>
          <span title="Fog">🌫️</span>
          <span title="Rainy">⛈️</span>
          <span title="Cloudy">⛅</span>
        </div>
      </div>
    </header>
    

    <main class="container my-auto">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5">
          
          <div class="card bg-white bg-opacity-75 border-0 shadow-lg rounded-5 p-4 text-center">
            
            <h2 class="fs-5 fw-bold text-primary-emphasis text-start mb-3">
              <i class="bi bi-cloud-sun-fill me-2"></i>Check Current Weather
            </h2>

            <div class="input-group mb-4 shadow-sm rounded-pill overflow-hidden bg-white p-1">
              <span class="input-group-text bg-transparent border-0 text-muted ps-3">
                <i class="bi bi-geo-alt-fill text-primary"></i>
              </span>
              <input
                type="text"
                name="city"
                id="city"
                placeholder="Enter city name..."
                class="form-control bg-transparent border-0 ps-1 py-2 text-dark fw-medium shadow-none"
              />
              <button class="btn btn-primary bg-gradient rounded-pill px-4 fw-bold" type="button" onclick="getWeather()">
                <i class="bi bi-search me-1"></i> Search
              </button>
            </div>
            

            <div id="WeatherData" class="p-4 bg-primary-subtle border border-primary-subtle rounded-4 d-flex flex-column align-items-center justify-content-center">
              <div class="text-primary-emphasis py-3">
                <i class="bi bi-cloud-lightning-rain display-3 text-primary mb-3 d-block"></i>
                <p class="mb-1 fs-6 fw-bold text-uppercase tracking-wide opacity-75">Today Weather</p>
                <small class="text-muted">Temprature</small>
              </div>
            </div>


          </div>
          
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
