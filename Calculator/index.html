<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-card">
        <div class="display-section">
            <input id="inputbox" type="text" name="display" placeholder="0" readonly>
        </div>
        <div class="buttons-grid">
            <button class="btn btn-light" onclick="Clear()">AC</button>
            <button class="btn btn-light" onclick="Delete()">C</button>
            <button class="btn btn-light" onclick="Input('%')">%</button>
            <button class="btn btn-orange" onclick="Input('/')">/</button>
            
            <button class="btn btn-light" onclick="Input('7')">7</button>
            <button class="btn btn-light" onclick="Input('8')">8</button>
            <button class="btn btn-light" onclick="Input('9')">9</button>
            <button class="btn btn-orange" onclick="Input('*')">*</button>
            
            <button class="btn btn-light" onclick="Input('4')">4</button>
            <button class="btn btn-light" onclick="Input('5')">5</button>
            <button class="btn btn-light" onclick="Input('6')">6</button>
            <button class="btn btn-orange" onclick="Input('-')">-</button>
            
            <button class="btn btn-light" onclick="Input('1')">1</button>
            <button class="btn btn-light" onclick="Input('2')">2</button>
            <button class="btn btn-light" onclick="Input('3')">3</button>
            <button class="btn btn-orange" onclick="Input('+')">+</button>
            
            <button class="btn btn-light" onclick="Input('0')">0</button>
            <button class="btn btn-light" onclick="Input('.')">.</button>
            <button class="btn btn-equal" onclick="Calculate()">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
